name: Release

# Pushing a version tag (e.g. v0.44.0) checks and builds the library, and publishes it as a release:
# etebase-<version>.tgz (made by npm pack, with the build in dist/), which npm can install from its
# URL, with its checksum.
on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm

      - name: Check that the version of the library is the one of the tag
        run: |
          version=$(node -p 'require("./package.json").version')
          if [ "v$version" != "$TAG" ]; then
            echo "package.json has version $version, but the tag is $TAG" >&2
            exit 1
          fi

      - run: npm ci --no-audit --no-fund

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npx tsc --noEmit

      - name: Unit tests
        run: npx jest src/Crypto.test.ts src/Helpers.test.ts

      - name: Package
        run: |
          # npm pack builds it again, with the prepare script, whose output goes to stdout too
          mkdir release
          npm pack --pack-destination release
          cd release
          file=$(ls etebase-*.tgz)
          tar -tzf "$file" | grep -qx 'package/dist/lib-cjs/Etebase.js'
          sha256sum "$file" > "$file.sha256"
          echo "FILE=release/$file" >> "$GITHUB_ENV"

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$TAG" "$FILE" "$FILE.sha256" --repo "$GITHUB_REPOSITORY" --title "$TAG" --generate-notes
