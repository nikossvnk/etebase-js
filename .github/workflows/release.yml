name: Release

# Pushing a version tag (e.g. v0.44.1) checks and builds the library, and publishes it as a release:
# etebase-<version>.tgz and react-native-etebase-<version>.tgz (made by npm pack, with the build in
# dist/), which npm can install from their URLs, with their checksums. Both packages have the
# version of the tag.
on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm

      - name: Check that the versions of the packages are the one of the tag
        run: |
          for package in package.json react-native-etebase/package.json; do
            version=$(node -p "require('./$package').version")
            if [ "v$version" != "$TAG" ]; then
              echo "$package has version $version, but the tag is $TAG" >&2
              exit 1
            fi
          done

      - run: npm ci --no-audit --no-fund

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npx tsc --noEmit

      - name: Unit tests
        run: npx jest src/Crypto.test.ts src/Helpers.test.ts

      - name: Package
        run: |
          # npm pack builds them again, with the prepare scripts, whose output goes to stdout too.
          # react-native-etebase is built against the library in the parent folder.
          mkdir release
          npm pack --pack-destination release
          (cd react-native-etebase && npm ci --no-audit --no-fund && npm pack --pack-destination ../release)
          cd release
          tar -tzf "etebase-${TAG#v}.tgz" | grep -qx 'package/dist/lib-cjs/Etebase.js'
          tar -tzf "react-native-etebase-${TAG#v}.tgz" | grep -qx 'package/dist/Etebase.js'
          for file in *.tgz; do
            sha256sum "$file" > "$file.sha256"
          done

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$TAG" release/* --repo "$GITHUB_REPOSITORY" --title "$TAG" --generate-notes
